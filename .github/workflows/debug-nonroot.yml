name: Debug non-root
on:
  push:
    branches: [cnti-nonroot]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
      - name: Root install on a PVC, then upgrade to www-data and capture why it is not Ready
        run: |
          helm repo add nextcloud https://nextcloud.github.io/helm
          helm install nc nextcloud/nextcloud --version 9.4.0 -n nc --create-namespace --set persistence.enabled=true --wait --timeout 15m
          kubectl exec -n nc deploy/nc-nextcloud -c nextcloud -- ls -lan /var/www/html/nextcloud-init-sync.lock /var/www/html/data /var/www/html | head -8
          helm upgrade nc nextcloud/nextcloud --version 9.4.0 -n nc --set persistence.enabled=true -f ci/cnti-nonroot.yaml
          sleep 150
          kubectl get pods -n nc -o wide
          P=$(kubectl get pod -n nc -l app.kubernetes.io/name=nextcloud --sort-by=.metadata.creationTimestamp -o name | tail -1)
          echo "== new pod $P"; kubectl get -n nc $P -o jsonpath='{.status.containerStatuses[0].restartCount} {.status.containerStatuses[0].state}{"\n"}'
          echo "== its log"; kubectl logs -n nc $P -c nextcloud --previous 2>/dev/null | grep -v 'GET /status.php' | head -40 || true
          kubectl logs -n nc $P -c nextcloud | grep -v 'GET /status.php' | head -40
          echo "== events"; kubectl get events -n nc --field-selector involvedObject.name=${P#pod/} --sort-by=.lastTimestamp | tail -12
          echo "== status.php"; kubectl exec -n nc $P -c nextcloud -- curl -s -H "Host: nextcloud.kube.home" http://localhost/status.php | head -c 400; echo
          echo "== occ status"; kubectl exec -n nc $P -c nextcloud -- php occ status 2>&1 | head -10
