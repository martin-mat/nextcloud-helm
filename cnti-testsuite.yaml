---
# CNTi Test Suite: the released Nextcloud chart, run as www-data instead of root.
config_version: "v2"
deployments:
  helm_charts:
    - name: nextcloud
      helm_repo_name: nextcloud
      helm_repo_url: https://nextcloud.github.io/helm
      helm_chart_name: nextcloud
      chart_version: 9.4.0
      namespace: nextcloud
      helm_values: --values ci/cnti-nonroot.yaml
